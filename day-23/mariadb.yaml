# MariaDB with persistent storage (slide 491): the StatefulSet creates one PersistentVolumeClaim
# per pod from "volumeClaimTemplates". It uses the cluster's default, dynamically provisioned class.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mariadb-statefulset
  labels:
    app: mariadb
spec:
  serviceName: mariadb-service
  replicas: 1
  selector:
    matchLabels:
      app: mariadb
  template:
    metadata:
      labels:
        app: mariadb
    spec:
      containers:
        - name: mariadb
          image: mariadb:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: MARIADB_ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: my-mariadb-secret, key: password } }
            - name: MARIADB_USER
              valueFrom: { secretKeyRef: { name: my-mariadb-secret, key: username } }
            - name: MARIADB_PASSWORD
              valueFrom: { secretKeyRef: { name: my-mariadb-secret, key: password } }
            - name: MARIADB_DATABASE
              value: wordpress
          ports:
            - name: mysql
              containerPort: 3306
          readinessProbe: # ready only once MariaDB accepts connections; the first start takes a few seconds
            tcpSocket:
              port: mysql
            periodSeconds: 3
          volumeMounts:
            - name: mariadb-data
              mountPath: /var/lib/mysql
          resources:
            requests: { cpu: 25m, memory: 64Mi }
            limits: { memory: 512Mi }
  volumeClaimTemplates:
    - metadata:
        name: mariadb-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: standard
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: mariadb-service
  labels:
    app: mariadb
spec:
  ports:
    - port: 3306
  selector:
    app: mariadb
