# MariaDB without any configuration: the container refuses to start (slide 407).
# It needs a root password, and the image reads it from an environment variable.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mariadb-nopassword
  labels:
    app: mariadb-nopassword
spec:
  serviceName: mariadb-nopassword
  replicas: 1
  selector:
    matchLabels:
      app: mariadb-nopassword
  template:
    metadata:
      labels:
        app: mariadb-nopassword
    spec:
      containers:
        - name: mariadb
          image: mariadb:latest
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
