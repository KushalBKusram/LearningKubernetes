# Slide 508: an nginx Deployment with a NodePort Service.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  labels:
    app: nginx
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      # One pod per node, so both zones serve traffic.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: nginx
      initContainers:
        # Writes the pod's name and node into the page, so you can see who answered.
        - name: page
          image: nginx:latest
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - echo "nginx pod $POD_NAME on node $NODE_NAME" > /page/index.html
          env:
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
            - name: NODE_NAME
              valueFrom: {fieldRef: {fieldPath: spec.nodeName}}
          volumeMounts:
            - {name: page, mountPath: /page}
      containers:
        - name: nginx
          image: nginx:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          resources:
            requests: {cpu: 10m, memory: 16Mi}
          volumeMounts:
            - {name: page, mountPath: /usr/share/nginx/html}
      volumes:
        - name: page
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-nodeport
spec:
  type: NodePort
  selector:
    app: nginx
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
---
# Slide 511: a Service of type LoadBalancer. On EKS this creates an EC2 load balancer.
# Here MetalLB hands it an address on the cluster's Docker network.
apiVersion: v1
kind: Service
metadata:
  name: nginx-lb
spec:
  type: LoadBalancer
  selector:
    app: nginx
  ports:
    - port: 80
      targetPort: 80
---
# The plain Service the Ingress points at (slide 519).
apiVersion: v1
kind: Service
metadata:
  name: nginx
spec:
  selector:
    app: nginx
  ports:
    - port: 80
      targetPort: 80
