# The WordPress Deployment from slides 395-402.
# The slides create it with
#   kubectl create deployment wordpress-deployment --image=wordpress --replicas=3 --port=80
# This file is the same thing as YAML, plus the labels from slide 400.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wordpress-deployment
  labels:
    app: wordpress
    version: "1.0" # a label on the Deployment itself: free to change (slide 400)
spec:
  replicas: 3
  selector:
    matchLabels:
      app: wordpress # how the Deployment finds its pods. Immutable once created (slide 402),
      # so it does not contain the version.
  template:
    metadata:
      labels:
        app: wordpress # the label every pod gets; it must match the selector above
    spec:
      containers:
        - name: wordpress
          image: wordpress:latest
          imagePullPolicy: IfNotPresent # the cluster already has the image (see lab.sh)
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 256Mi
