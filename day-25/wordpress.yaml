# Slide 537: WordPress with a shared filesystem. On EKS this is an EFS volume;
# here it is the NFS-backed StorageClass "efs", which supports ReadWriteMany, so pods
# on both nodes (both zones) mount the same files.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wp-content
spec:
  accessModes: ["ReadWriteMany"]
  storageClassName: efs
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wordpress
  labels:
    app: wordpress
spec:
  replicas: 2
  selector:
    matchLabels:
      app: wordpress
  template:
    metadata:
      labels:
        app: wordpress
    spec:
      # One pod per zone: they can only both run because the volume is shared (ReadWriteMany).
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: wordpress
      containers:
        - name: wordpress
          image: wordpress:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: WORDPRESS_DB_HOST
              value: mysql
            - name: WORDPRESS_DB_NAME
              valueFrom: {secretKeyRef: {name: mysql, key: database}}
            - name: WORDPRESS_DB_USER
              valueFrom: {secretKeyRef: {name: mysql, key: user}}
            - name: WORDPRESS_DB_PASSWORD
              valueFrom: {secretKeyRef: {name: mysql, key: password}}
          ports:
            - containerPort: 80
          readinessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests: {cpu: 50m, memory: 128Mi}
          volumeMounts:
            - {name: wp-content, mountPath: /var/www/html/wp-content}
      volumes:
        - name: wp-content
          persistentVolumeClaim:
            claimName: wp-content
---
apiVersion: v1
kind: Service
metadata:
  name: wordpress
spec:
  type: NodePort
  selector:
    app: wordpress
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30081 # published on the server as port 8450 by day-24/cluster.yaml
